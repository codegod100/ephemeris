name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        env:
          TZ: UTC

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Binary launcher icons aren't committed; this regenerates Flutter's
      # defaults without touching existing files.
      - run: flutter create --org io.github.heliosky --project-name helios_sky --platforms android,ios .
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: helios-sky-apk
          path: build/app/outputs/flutter-apk/app-release.apk
